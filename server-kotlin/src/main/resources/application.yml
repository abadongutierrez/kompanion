server:
  port: ${PORT:3200}

spring:
  application:
    name: server
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sdlc}
    username: ${SPRING_DATASOURCE_USERNAME:sdlc}
    password: ${SPRING_DATASOURCE_PASSWORD:sdlc}
    hikari:
      # Pin sessions to UTC (the removed Node server's postgres.js driver
      # did this by default); without it, date_trunc('month', now()) runs in the DB
      # server/OS local time zone instead, shifting periodStart/spend-window
      # boundaries by the local UTC offset.
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    baseline-on-migrate: true
    baseline-version: "11"

claude:
  # Backstop for a stuck run, not a work budget — the process is SIGKILLed
  # at this point, which loses whatever the agent hadn't committed yet.
  # Spend is bounded by the team budget instead (see BudgetService).
  run-timeout-ms: ${CLAUDE_RUN_TIMEOUT_MS:1800000}

heartbeat:
  enabled: ${HEARTBEAT_ENABLED:false}
  interval-ms: ${HEARTBEAT_INTERVAL_MS:30000}
