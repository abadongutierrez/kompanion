# Bypasses a stale global proxy in ~/.gradle/gradle.properties
# (systemProp.http(s).proxyHost=127.0.0.1:9000, added by NetBeans — nothing
# listens on that port anymore, which otherwise breaks all plugin/dependency
# resolution for this project with "Connection refused"). Scoped to this
# project only via the standard nonProxyHosts bypass list; the global file
# is intentionally left untouched.
systemProp.http.nonProxyHosts=plugins.gradle.org|repo.maven.apache.org|repo1.maven.org|services.gradle.org|*.gradle.org
systemProp.https.nonProxyHosts=plugins.gradle.org|repo.maven.apache.org|repo1.maven.org|services.gradle.org|*.gradle.org
